version: '3.8'

networks:
  memostack_net:
    driver: bridge

volumes:
  db_data:
    driver: local

services:
  # 1. Cơ sở dữ liệu: Chạy nội bộ trên Home Server, data lưu vào volume ổ cứng vật lý
  database:
    image: mongo:7.0
    container_name: memostack-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-memouser}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-securepassword123}
      MONGO_INITDB_DATABASE: noteapp
    volumes:
      - db_data:/data/db
    networks:
      - memostack_net
    # KHÔNG mở ports ra ngoài Host để chống trùng port và bảo mật tuyệt đối

  # 2. Backend: Package build sẵn từ GitHub Actions (GHCR)
  backend:
    image: ghcr.io/tranducanh3103/note-backend:latest
    container_name: memostack-api
    restart: always
    depends_on:
      - database
    environment:
      PORT: 5000
      NODE_ENV: production
      # Trỏ trực tiếp vào hostname 'database' trong mạng Docker memostack_net
      MONGO_URI: mongodb://${DB_USER:-memouser}:${DB_PASSWORD:-securepassword123}@database:27017/noteapp?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://*.vercel.app}
      # Vector DB & AI Keys (nếu sử dụng tính năng AI)
      SUPABASE_HOST: ${SUPABASE_HOST}
      SUPABASE_PORT: ${SUPABASE_PORT:-5432}
      SUPABASE_DB: ${SUPABASE_DB:-postgres}
      SUPABASE_USER: ${SUPABASE_USER:-postgres}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      GROK_API_KEY: ${GROK_API_KEY}
      OPENROUTER_EMBED_KEY: ${OPENROUTER_EMBED_KEY}
    networks:
      - memostack_net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # 3. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: memostack-nginx
    restart: always
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # CHỈ BIND VÀO 127.0.0.1 và dùng port 8088 -> Tuyệt đối không xung đột port 80/443 của host
      - "127.0.0.1:8088:80"
    networks:
      - memostack_net

  # 4. Watchtower: Tự động kiểm tra GHCR và cập nhật container khi có commit mới
  watchtower:
    image: containrrr/watchtower
    container_name: memostack-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount file auth nếu package trên GHCR ở chế độ Private (tùy chọn)
      - ~/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60 # Kiểm tra mỗi 60 giây
      - WATCHTOWER_LABEL_ENABLE=true # Chỉ tự động update container có label enable
    networks:
      - memostack_net
